[all:vars]
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3
# SSH key used from your Mac (same one you use with `ssh -i ...`).
ansible_ssh_private_key_file=~/Documents/clicque/leet-clicque-key.pem
# Match the host-key behavior of a fresh ssh; comment out if you've
# already accepted the fingerprints in ~/.ssh/known_hosts.
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new
# The playbook runs `become: true`, so sudo is used per task. If your
# ubuntu user needs a sudo password, uncomment the next line and pass
# --ask-become-pass on the command line, or set BECOME_PASS in env.
# ansible_become_password={{ lookup('env','BECOME_PASS') }}
